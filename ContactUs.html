<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us | Khushi Travel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f9f9f9;
      color: #333;
    }

    /* Navbar */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #222;
      padding: 10px 20px;
    }

    .navbar a {
      color: #fff;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }

    .navbar a:hover {
      text-decoration: underline;
    }

    /* Contact section */
    .contact-section {
      padding: 50px 20px;
      text-align: center;
    }

    .contact-section h1 {
      font-size: 36px;
      margin-bottom: 20px;
      color: #222;
    }

    .contact-section p {
      font-size: 18px;
      max-width: 800px;
      margin: 0 auto 40px;
      line-height: 1.6;
    }

    /* Contact form */
    form {
      max-width: 500px;
      margin: 0 auto;
      text-align: left;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background-color: #222;
      color: #fff;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #444;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <div class="navbar">
    <div class="logo">🌴 Khushi Travel</div>
    <div class="menu">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact Us</a>
    </div>
  </div>

  <!-- Contact Section -->
  <div class="contact-section">
    <h1>Contact Us</h1>
    <p>We’d love to hear from you! Reach out to us with your questions, feedback, or travel stories.</p>

    <h3>Contact Information</h3>
    <p>Email: <a href="mailto:info@khushitravel.com">info@khushitravel.com</a></p>
    <p>Phone: +91 98765 43210</p>
    <p>Address: Khushi Travel, New Delhi, India</p>

    <!-- Contact Form -->
    <form action="mailto:info@khushitravel.com" method="post" enctype="text/plain">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
